<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Due Date Calculator · คำนวณงวดชำระ</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-grid"></div>

  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-mark">◈</span>
        <span class="logo-text">DueDateCalc</span>
      </div>
      <p class="subtitle">คำนวณวันดิวเดทตามงวดชำระ</p>
    </header>

    <main>
      <section class="card form-card">
        <div class="form-grid">
          <div class="field">
            <label for="start-date">
              <span class="field-num">01</span>
              วันที่ดิวเดทเริ่มต้น
            </label>
            <input type="date" id="start-date" />
          </div>

          <div class="field">
            <label for="installments">
              <span class="field-num">02</span>
              จำนวนงวด
            </label>
            <input type="number" id="installments" min="1" max="360" value="12" placeholder="12" />
          </div>

          <div class="field">
            <label for="period-type">
              <span class="field-num">03</span>
              ความถี่การชำระ
            </label>
            <select id="period-type">
              <option value="monthly">รายเดือน</option>
              <option value="weekly">รายสัปดาห์</option>
              <option value="quarterly">รายไตรมาส (3 เดือน)</option>
              <option value="bimonthly">ทุก 2 เดือน</option>
              <option value="yearly">รายปี</option>
            </select>
          </div>

          <div class="field">
            <label for="amount">
              <span class="field-num">04</span>
              จำนวนเงินต่องวด (บาท)
            </label>
            <input type="number" id="amount" min="0" step="0.01" placeholder="ไม่บังคับ" />
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-calc" onclick="calculate()">
            <span>คำนวณ</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="btn-export" id="export-btn" onclick="exportExcel()" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Export Excel</span>
          </button>
        </div>
      </section>

      <section id="summary-section" class="summary-section" style="display:none;">
        <div class="stat-card">
          <div class="stat-label">งวดทั้งหมด</div>
          <div class="stat-value" id="s-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">งวดแรก</div>
          <div class="stat-value sm" id="s-first">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">งวดสุดท้าย</div>
          <div class="stat-value sm" id="s-last">—</div>
        </div>
        <div class="stat-card" id="s-total-card" style="display:none;">
          <div class="stat-label">ยอดรวมทั้งหมด</div>
          <div class="stat-value sm" id="s-total-amount">—</div>
        </div>
      </section>

      <section id="result-section" style="display:none;">
        <div class="table-wrap">
          <table id="result-table">
            <thead>
              <tr>
                <th>งวดที่</th>
                <th>วันที่ (พ.ศ.)</th>
                <th>วันที่ (ค.ศ.)</th>
                <th id="amount-header" style="display:none; text-align:right;">จำนวนเงิน (บาท)</th>
              </tr>
            </thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
      </section>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon">◈</div>
        <p>กรอกข้อมูลและกด <strong>คำนวณ</strong> เพื่อดูตารางงวด</p>
      </div>
    </main>

    <footer class="footer">
      <span>Due Date Calculator</span>
      <span>·</span>
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
